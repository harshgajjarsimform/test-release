name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to deploy (US or EU)'
        required: true
        type: choice
        options:
          - US
          - EU

jobs:
  verify:
    uses: AptlyDone/infrastructure/.github/workflows/verify-release-tag.yml@reusable-workflows
    with:
      tag-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: "production-${{ github.event.inputs.region == 'US' && 'us' || 'eu' }}"
    steps:
      - run: |
          echo "Simulating deploy to ${{ github.event.inputs.region }}..."
          echo "Applying manifest for image tag: ${{ github.ref_name }}"
