name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate version and main state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' does not match required format vX.Y.Z (e.g. v1.2.3)"
            exit 1
          fi
          echo "Version format OK: $VERSION"

      - name: Validate tag does not already exist
        run: |
          VERSION="${{ inputs.version }}"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists. Versions are immutable — pick a new one."
            exit 1
          fi
          echo "Tag $VERSION is unused, OK to proceed."

      - name: Validate version is the next allowed increment
        run: |
          VERSION="${{ inputs.version }}"
          git fetch --tags -q

          LATEST="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"

          if [ -z "$LATEST" ]; then
            echo "No existing release tags found — $VERSION is accepted as the first release."
            exit 0
          fi
          echo "Latest existing release: $LATEST"

          IFS='.' read -r L_MAJOR L_MINOR L_PATCH <<< "${LATEST#v}"
          NEXT_PATCH="v${L_MAJOR}.${L_MINOR}.$((L_PATCH + 1))"
          NEXT_MINOR="v${L_MAJOR}.$((L_MINOR + 1)).0"
          NEXT_MAJOR="v$((L_MAJOR + 1)).0.0"

          if [ "$VERSION" = "$NEXT_PATCH" ] || [ "$VERSION" = "$NEXT_MINOR" ] || [ "$VERSION" = "$NEXT_MAJOR" ]; then
            echo "'$VERSION' is a valid next version after '$LATEST'."
          else
            echo "::error::'$VERSION' is not a valid next version after '$LATEST'."
            echo "::error::Allowed next versions from here: $NEXT_PATCH (patch), $NEXT_MINOR (minor), or $NEXT_MAJOR (major)."
            echo "::error::Skipping versions, going backwards, or releasing an unrelated version number is not allowed."
            exit 1
          fi

      - name: Validate dispatched ref is the current tip of main
        run: |
          git fetch origin main
          DISPATCHED_SHA="${{ github.sha }}"
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "Dispatched commit: $DISPATCHED_SHA"
          echo "origin/main tip:   $MAIN_SHA"
          if [ "$DISPATCHED_SHA" != "$MAIN_SHA" ]; then
            echo "::error::This workflow was dispatched against a commit that is not the current tip of main."
            echo "::error::main has moved since — re-run the dispatch against the latest main before releasing."
            exit 1
          fi
          echo "Confirmed: releasing the current tip of main."

  release:
    name: Tag and build
    runs-on: ubuntu-latest
    needs: validate
    environment: release-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          FULL_TAG="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$FULL_TAG"
          git push origin "$FULL_TAG"
          

      - name: "Build (simulated)"
        run: |
          VERSION="${{ inputs.version }}"
          echo "Building application for release $VERSION @ commit ${{ github.sha }}"
          echo "docker build -t myapp:$VERSION ."
          echo "docker push myapp:$VERSION"
          echo "Build complete — image tag '$VERSION' is now the published artifact for this release."

      - name: Summary
        run: |
          {
            echo "## Release $VERSION created"
            echo ""
            echo "- Git tag: \`${{ inputs.version }}\`"
            echo "- Image tag: \`${{ inputs.version }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
