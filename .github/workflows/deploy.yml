name: Deploy

# IMPORTANT: when running this workflow, use the "Use workflow from" ref-picker
# on the "Run workflow" form and SELECT A TAG (e.g. v1.2.3) — do not dispatch
# from a branch. GitHub's Environment "deployment branch/tag policy" (see
# production-us / production-eu in repo Settings > Environments) enforces this
# against the actual dispatch ref, not against any text typed into an input.
# The version being deployed is read from that ref (github.ref_name) below.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Target region"
        required: true
        type: choice
        options:
          - US
          - EU

permissions:
  contents: read

jobs:
  verify:
    name: Verify release exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm this run was dispatched from a release tag
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::This workflow must be run from a tag (e.g. v1.2.3), not a branch."
            echo "::error::On the 'Run workflow' form, use 'Use workflow from' to pick the release tag you want to deploy."
            exit 1
          fi
          echo "Dispatched from tag: ${{ github.ref_name }}"

      - name: Confirm tag matches the release version format
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match the release version format vX.Y.Z."
            echo "::error::Only tags produced by the Release workflow may be deployed."
            exit 1
          fi
          echo "Confirmed: '$TAG' is a valid release tag."

  deploy:
    name: "Deploy to ${{ inputs.region }}"
    runs-on: ubuntu-latest
    needs: verify
    environment: "production-${{ inputs.region == 'US' && 'us' || 'eu' }}"
    steps:
      - name: "Deploy (simulated)"
        run: |
          TAG="${{ github.ref_name }}"
          REGION="${{ inputs.region }}"
          echo "Deploying release '$TAG' to region '$REGION'"
          echo "----------------------------------------------"
          echo "# What a real deploy step does here (kept as comments/echo for this test repo):"
          echo "#   az login --service-principal ..."
          echo "#   az aks get-credentials --resource-group rg-prod-$REGION --name prod-aks-$REGION"
          echo "#   sed -i 's|IMAGE_TAG|'$TAG'|' k8s/prod-$REGION-app.yaml"
          echo "#   kubectl apply -f k8s/prod-$REGION-app.yaml"
          echo "----------------------------------------------"
          echo "Deployment of $TAG to $REGION completed (simulated)."

      - name: Summary
        run: |
          {
            echo "## Deployed $TAG to $REGION"
            echo ""
            echo "- Approved via GitHub Environment: \`production-${REGION_LOWER}\`"
            echo "- Triggered by: \`${{ github.actor }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ github.ref_name }}
          REGION: ${{ inputs.region }}
          REGION_LOWER: ${{ inputs.region == 'US' && 'us' || 'eu' }}

  deploy-2:
    name: "Deploy to"
    runs-on: ubuntu-latest
    needs: deploy
    environment: "production-${{ inputs.region == 'US' && 'us' || 'eu' }}"
    steps:
      - name: "Deploy (simulated)"
        run: |
          TAG="${{ github.ref_name }}"
          REGION="${{ inputs.region }}"
          echo "Deploying release '$TAG' to region '$REGION'"
          echo "----------------------------------------------"
          echo "# What a real deploy step does here (kept as comments/echo for this test repo):"
          echo "#   az login --service-principal ..."
          echo "#   az aks get-credentials --resource-group rg-prod-$REGION --name prod-aks-$REGION"
          echo "#   sed -i 's|IMAGE_TAG|'$TAG'|' k8s/prod-$REGION-app.yaml"
          echo "#   kubectl apply -f k8s/prod-$REGION-app.yaml"
          echo "----------------------------------------------"
          echo "Deployment of $TAG to $REGION completed (simulated)."

      - name: Summary
        run: |
          {
            echo "## Deployed $TAG to $REGION"
            echo ""
            echo "- Approved via GitHub Environment: \`production-${REGION_LOWER}\`"
            echo "- Triggered by: \`${{ github.actor }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ github.ref_name }}
          REGION: ${{ inputs.region }}
          REGION_LOWER: ${{ inputs.region == 'US' && 'us' || 'eu' }}
