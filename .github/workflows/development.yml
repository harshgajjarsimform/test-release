name: Development build and deploy to AKS

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

jobs:
  notify-started:
    name: Notify — Pipeline Started
    uses: AptlyDone/infrastructure/.github/workflows/notify-teams.yml@reusable-workflows
    with:
      status: 'started'
      environment: 'Development'
    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  build:
    needs: notify-started
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Simulating docker build..."
          echo "Building image for tag: ${{ github.sha }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - run: |
          echo "Simulating deploy..."
          echo "Applying manifest for image tag: ${{ github.sha }}"

  notify-result:
    name: Notify — Pipeline Result
    needs: deploy
    if: always()
    uses: AptlyDone/infrastructure/.github/workflows/notify-teams.yml@reusable-workflows
    with:
      status: ${{ needs.deploy.result }}
      environment: 'Development'
    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
