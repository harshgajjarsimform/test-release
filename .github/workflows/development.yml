name: Development build and deploy to AKS

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

jobs:
  notify-started:
    name: Notify — Pipeline Started
    uses: AptlyDone/infrastructure/.github/workflows/notify-teams.yml@reusable-workflows
    with:
      status: 'started'
      environment: 'Development'
    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  build:
    needs: notify-started
    uses: AptlyDone/infrastructure/.github/workflows/docker-build-push.yml@reusable-workflows
    with:
      platforms: linux/arm64
      image-tag: ${{ github.sha }}
      build-args: |
        NODE_ENV=development
      cache-mode: gha
      use-native-arm-runner: true
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      IMAGE_REPO: ${{ secrets.DEV_AKS_REPO }}

  deploy:
    needs: build
    uses: AptlyDone/infrastructure/.github/workflows/deploy-to-aks.yml@reusable-workflows
    with:
      resource-group: rg-dev
      cluster-name: dev-aks
      manifest-path: ./k8s/dev-actions.yaml
      image-tag: ${{ github.sha }}
      environment: development
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      IMAGE_REPO: ${{ secrets.DEV_AKS_REPO }}

  notify-result:
    name: Notify — Pipeline Result
    needs: deploy
    if: always()
    uses: AptlyDone/infrastructure/.github/workflows/notify-teams.yml@reusable-workflows
    with:
      status: ${{ needs.deploy.result }}
      environment: 'Development'
    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
