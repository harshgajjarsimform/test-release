name: Staging Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match vX.Y.Z"
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging-release-approval
    outputs:
      tag_name: stage-${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          TAG="stage-${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  build:
    needs: release
    uses: AptlyDone/infrastructure/.github/workflows/docker-build-push.yml@reusable-workflows
    with:
      platforms: linux/arm64
      image-tag: ${{ needs.release.outputs.tag_name }}
      use-native-arm-runner: true
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      IMAGE_REPO: ${{ secrets.STAGING_AKS_REPO }}
