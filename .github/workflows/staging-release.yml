name: Staging Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match vX.Y.Z"
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: release-approval
    outputs:
      tag_name: stage-${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          TAG="stage-${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Simulating docker build..."
          echo "Building image for tag: ${{ needs.release.outputs.tag_name }}"
